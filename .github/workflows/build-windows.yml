name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download fpcalc (Chromaprint) so it's bundled into the exe
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/acoustid/chromaprint/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "*windows-x86_64*.zip" } | Select-Object -First 1
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile fpcalc.zip
          Expand-Archive -Path fpcalc.zip -DestinationPath fpcalc_extracted -Force
          $fpcalcExe = Get-ChildItem -Path fpcalc_extracted -Filter fpcalc.exe -Recurse | Select-Object -First 1
          Copy-Item $fpcalcExe.FullName -Destination fpcalc.exe

      - name: Build standalone EXE
        run: |
          pyinstaller --onefile --windowed --name TuneTidy --add-binary "fpcalc.exe;." main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TuneTidy-windows
          path: dist/TuneTidy.exe

      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TuneTidy.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
